<!doctype html>
<html lang="en">
    <head>
        <style>

            /* ----- General ----- */

            body {
                flex: 1;
                height: auto;
                margin: 0;
                padding: 0;
                font-family: Georgia, 'Times New Roman', Times, serif;
                color: #000;
            }

            section {
                z-index: 200;
                box-sizing: border-box;
                margin: 5px;
                padding: 10px;
                border: 1px solid blue;
            }

            div {
                box-sizing: border-box;
                margin: 2px;
                padding: 2px;
                border: 1px solid black;
            }

            /*text*/

            h1 {
                font-size: 20px;
            }

            h2 {
                font-size: 18px;
            }
            
            h3{
                font-size: 16px;
            }

            h4 {
                font-size: 14px;
            }

            p {
                font-size: 12px;
            }

            /*special*/

            button {
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 2px;
                padding: auto;
                width: auto;
                height: auto;
                font-size: 12px;
                border-radius: 2px;
                border: 1px solid #989898;
                background: #999999;
                color: #222;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                transition: 3s ease;
            }

            button:hover {
                background: #777777;
                color: #000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            }

            button:focus {
                background: #888888;
                color: #111;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.12);
            }

            hr {
                width: 100%;
                height: 1px;
                background: #000;
            }


            /* ----- Back Planes ----- */

            #Back, .backPlane {
                flex: 1;
                margin: 0;
                padding: 0;
                border: none;
            }

            #backPlane1 {
                z-index: 001;
            }

            #backPlane2 {
                z-index: 050;
            }

            #backPlane3 {
                z-index: 100;
            }


            /* ----- Ext Section ----- */

            #extHead {
                flex: 1;
                display: flex;
                justify-content: flex-end;
            }

            /* ----- Nav Section ----- */

            #navHead, .navTitle, .navIcons, #navBody {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .navTitle {
                width: 60%;
            }

            .logo {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 5%;
            }

            .tm {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                width: 95%;
            }

            .navIcons {
                margin-right: 1%;
                gap: 5px;
            }

            .navButton {
                flex-basis: calc(20% - 10px);
            }

            #navTail {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .xNav {
                width: 100%;
            }


            /* ----- Head Section ----- */


            /* ----- Body Section ----- */

            #BodyMain {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-evenly;
                gap: 10px;
            }

            .Left {
                width: 10%;
            }
            
            .Center {
                flex: 1;
                width: auto;
                height: 100%;
            }

            .Right {
                flex: 1;
                width: auto;
                height: 100%;
            }


            /* ----- Tail Section ----- */

            #TailMain {
                display: flex;
                justify-content: space-evenly;
                align-items: center;
            }

            .TailContainer {
                width: calc(50% - 10px);
            }


            /* ----- Post Section ----- */

            .PostRow {
                display: flex;
                justify-content: space-evenly;
                align-items: center;
            }

            .PostItem {
                width: 30%;
            }

        </style>
    </head>
    <body>

        <div id="Back">
        <div class="backPlane" id="plane1">
        <div class="backPlane" id="plane2">
        <div class="backPlane" id="plane2">

        <section id="Extended">
            Ext
            <div class="container" id="extContainer">
                <div class="part" id="extHead">
                    <button>x</button>
                </div>
                <div class="part" id="extBody">
                    <div class="extPage">
                        <div class="extSection"></div>
                        <div class="extSection"></div>
                        <div class="extSection"></div>
                    </div>
                    <div class="extPage">
                        <div class="extSection"></div>
                        <div class="extSection"></div>
                        <div class="extSection"></div>
                    </div>
                    <div class="extPage">
                        <div class="extSection"></div>
                        <div class="extSection"></div>
                        <div class="extSection"></div>
                    </div>
                </div>
                <div class="part" id="extTail"></div>
            </div>
        </section>

        <section id="Nav">
            Nav
            <div class="container" id="navContainer">
                <div class="part" id="navHead">
                    <div class="navTitle">
                        <div class="logo">
                            <img id="logo-img">
                        </div>
                        <div class="tm">
                            <h3></h3>
                        </div> 
                    </div>
                    <div class="navIcons">
                        <button class="navIcon"></button>
                        <button class="navIcon"></button>
                        <button class="navIcon"></button>
                        <button class="navIcon"></button>
                    </div>
                </div>
                <div class="part" id="navBody">
                    <button class="navButton"></button>
                    <button class="navButton"></button>
                    <button class="navButton"></button>
                    <button class="navButton"></button>
                    <button class="navButton"></button>
                </div>
                <div class="part" id="navTail">
                    <button></button>
                    <div class="xNav"></div>
                </div>
            </div>
        </section>

        <section id="Head">
            Head
            <div class="container" id="headContainer">
                <div class="Title">
                    <div class="titleContainer">
                        <div class="titleBackground">
                            <div class="titleMain">
                                <div class="titleSection" id="titleHeader"></div>  
                                <div class="titleSection" id="titleBody"></div>
                                <div class="titleSection" id="titleTail"></div>
                            </div> 
                        </div> 
                    </div>
                </div>
                <div class="Tabs">
                    <div class="tabsSection" id="tabs">
                        <div class="tabsBackground"> 
                            <div class="tabsMain"> 
                                <div class="tabsSection" id="tabsHeader"></div>  
                                <div class="tabsSection" id="tabsBody"></div>
                                <div class="tabsSection" id="tabsTail"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="Body">
            Body
            <div class="part" id="BodyHead"></div>
            <div class="part" id="BodyMain">
                <div class="Left">
                    <div class="leftContainer">
                        <div class="leftBackground">
                            <div class="leftMain">
                                <div class="leftSection" id="leftHeader"></div>  
                                <div class="leftSection" id="leftBody"></div>
                                <div class="leftSection" id="leftTail"></div>
                            </div>
                        </div>  
                    </div>
                </div>
                <div class="Center">
                    <div class="centerContainer">
                        <div class="centerBackground">
                            <div class="centerMain">
                                <div class="centerSection" id="centerHeader"></div>  
                                <div class="centerSection" id="centerBody"></div>
                                <div class="centerSection" id="centerTail"></div>
                            </div>
                        </div> 
                    </div>
                </div>
                <div class="Right">
                    <div class="rightContainer">
                        <div class="rightBackground">
                            <div class="rightMain">
                                <div class="rightSection" id="rightHeader"></div>  
                                <div class="rightSection" id="rightBody"></div>
                                <div class="rightSection" id="rightTail"></div>
                            </div>
                        </div> 
                    </div>
                </div>
            </div>
            <div class="Part" id="BodyTail"></div>
        </section>

        <section id="Tail">
            Tail
            <div class="part" id="TailHead"></div>
            <div class="part" id="TailMain">
                <div class="TailContainer">
                    <div class="TailLeft">
                        <div class="leftBackground">
                            <div class="leftMain">
                                <div class="leftSection" id="leftHeader"></div>  
                                <div class="leftSection" id="leftBody"></div>
                                <div class="leftSection" id="leftTail"></div>
                            </div>
                        </div>  
                    </div>
                </div>
                <div class="TailContainer">
                    <div class="TailRight">
                        <div class="rightBackground">
                            <div class="rightMain">
                                <div class="rightSection" id="rightHeader"></div>  
                                <div class="rightSection" id="rightBody"></div>
                                <div class="rightSection" id="rightTail"></div>
                            </div>
                        </div> 
                    </div>
                </div>
            </div>
            <div class="Part" id="BodyTail"></div>
        </section>

        <section id="Post">
            Post
            <div class="part" id="PostHead"></div>
            <div class="part" id="PostBody">
                <div class="PostContainer">
                    <div class="PostRow">
                        <div class="PostItem"></div>
                        <div class="PostItem"></div>
                        <div class="PostItem"></div>
                    </div>
                    <div class="PostRow">
                        <div class="PostItem"></div>
                        <div class="PostItem"></div>
                        <div class="PostItem"></div>
                    </div>
                    <div class="PostRow">
                        <div class="PostItem"></div>
                        <div class="PostItem"></div>
                        <div class="PostItem"></div>
                    </div>
                </div>
            </div>
            <div class="PostTail"></div>
        </section>

        </div>
        </div>
        </div>
        </div>

    </body>
</html>
