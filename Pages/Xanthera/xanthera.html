<!doctype html>
<html lang="en">
    <head>
        <style>
            /* 1. Global Reset & Fix Body Dimensions */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 100vw;
                height: 100vh;
                overflow: hidden; /* Prevent scrolling during transitions */
                background: #000; /* Backdrop for the fades */
            }

            /* 2. The Backplane Base */
            .backplane {
                position: fixed; /* Keep them locked to the screen */
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding-top: 20px;
                
                /* Transition Logic */
                opacity: 0;
                visibility: hidden;
                z-index: 10;
            }

            /* Active State */
            .backplane.active {
                opacity: 1;
                visibility: visible;
                z-index: 50; /* Higher than inactive planes */
            }

            /* Metallic Sheen Overlay */
            .backplane::after {
                content: "";
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                background: linear-gradient(105deg, 
                    rgba(255,255,255,0) 30%, 
                    rgba(255,255,255,0.15) 50%, 
                    rgba(255,255,255,0) 70%);
                pointer-events: none;
            }

            /* 3. Specific Metallic Skins */
            .backplane1 { background: linear-gradient(135deg, #bdc3c7 0%, #ffffff 50%, #7f8c8d 100%); color: #2c3e50; 
                            transition: opacity 2.5s ease-in-out, visibility 2.5s; }
            .backplane2 { background: linear-gradient(135deg, #e3d9c6 0%, #f9f4e8 50%, #c4b7a1 100%); color: #5d5444; 
                            transition: opacity 3.5s ease-in-out, visibility 3.5s; }
            .backplane3 { background: linear-gradient(135deg, #d4af37 0%, #f9e29c 50%, #8a6d3b 100%); color: #3e2f0d; 
                            transition: opacity 3s ease-in-out, visibility 3s; }

            /* 4. Typography & "Etched" Effects */
            .backplane p, .backplane h3 {
                font-family: 'Segoe UI', Roboto, sans-serif;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 3px;
                /* Animation start point */
                transform: translateY(20px);
                opacity: 0;
                transition: transform 1s ease-out 0.8s, opacity 1s ease-out 0.8s;
            }

            .backplane.active p, .backplane.active h3 {
                transform: translateY(0);
                opacity: 1;
            }

            /* Specific Shadowing for each metal */
            .backplane1 p { text-shadow: -1px -1px 1px rgba(0,0,0,0.2), 1px 1px 1px rgba(255,255,255,0.7); }
            .backplane2 h3 { text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }
            .backplane3 p { text-shadow: 0px 1px 0px rgba(255,255,255,0.4); width: 80%; }

            /* Layouts */
            .welcomeP { display: flex; flex-direction: column; gap: 10px; }
            .welcomePRow1, .welcomePRow2 { display: flex; justify-content: center; gap: 15px; }
            .welcomePRow1 p { font-size: 2.5rem; }
            .welcomePRow2 p { font-size: 4.5rem; }

            .logoPage {
                position: absolute;
                top: 10px;
                margin-bottom: -10px;
                max-width: 80vw;
                max-height: 80vh;
            }
            .logo {
                max-width: 80vw;
                max-height: 80vh;
                height: auto;
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <div class="backplane backplane1">
            <div class="welcomeNote">
                <div class="welcomeP">
                    <div class="welcomePRow1">
                        <p>Hello</p>
                        <p>and</p>
                    </div>
                    <div class="welcomePRow2">
                        <p>Welcome</p>
                        <p>to</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="backplane backplane2">
            <div class="logoPage">
                <img class="logo" src="XanthLogo.jpg">
                <div>
                    <h3>For the world that could be.</h3>
                </div>
            </div>
        </div>
        <div class="backplane backplane3">
            <p>Stay tuned as prepare to bring you a whole new line of products for your leisure!</p>
        </div>

        <script>
document.addEventListener('DOMContentLoaded', () => {
    const planes = [
        document.querySelector('.backplane1'),
        document.querySelector('.backplane2'),
        document.querySelector('.backplane3')
    ];

    function transitionTo(index) {
        // Start fading out previous plane
        planes.forEach(p => p.classList.remove('active'));

        // Shortened "breathe" for the first transition to keep it snappy
        // but kept standard for the gold reveal
        const breatheTime = (index === 1) ? 1000 : 1600;

        setTimeout(() => {
            if (planes[index]) {
                planes[index].classList.add('active');
            }
        }, breatheTime); 
    }

    // --- The Reveal Sequence ---

    // 1. Silver (Quick Intro)
    // Starts immediately.
    setTimeout(() => {
        planes[0].classList.add('active');
    }, 200);

    // 2. Sand (Branding/Logo - Stays longer)
    // We move away from Silver after only 2.5 seconds
    setTimeout(() => {
        transitionTo(1);
    }, 2800);

    // 3. Gold (Placeholder/Final - Permanent)
    // We stay on the Logo for 7 seconds before moving to the Gold
    setTimeout(() => {
        transitionTo(2);
    }, 8000); 
});
        </script>
    </body>
</html>
